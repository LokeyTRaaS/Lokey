version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # errcheck, govet, ineffassign, staticcheck and unused are enabled by default
  enable:
    - gosec      # Security issues
    - misspell   # Spelling errors
    - gocritic   # Go code review
    - revive     # Fast, configurable, extensible, flexible linter

  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close

    govet:
      enable-all: true
      disable:
        - shadow
        - fieldalignment  # Overly strict

    gosec:
      excludes:
        - G115  # Handled with #nosec where appropriate

    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    rules:
      # Exclude some linters from running on test files
      - path: _test\.go
        linters:
          - errcheck
          - gosec
    paths:
      - pkg/api/docs  # Swagger generated code

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
