name: NixOS SD Image (Pi 5)

# Full Pi 5 SD images are too heavy for every tag (cold kernel builds often
# take 1–4h). Run manually or on the weekly schedule; attach to a release
# with: gh release upload <tag> dist/* --clobber
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC

permissions:
  contents: write

jobs:
  sdcard:
    name: Build flashable SD image
    # Native aarch64 — avoids qemu for the Pi 5 image.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v9
        continue-on-error: true

      - name: Build SD image
        run: |
          set -euo pipefail
          nix build .#packages.aarch64-linux.sdcard -L --out-link result-sdcard
          mkdir -p dist
          IMG="$(find -L result-sdcard -type f \( -name '*.img.zst' -o -name '*.img.gz' -o -name '*.img' \) | head -n1)"
          test -n "${IMG}"
          case "${IMG}" in
            *.img.zst) OUT="dist/lokey-pi5-sdcard.img.zst" ;;
            *.img.gz)  OUT="dist/lokey-pi5-sdcard.img.gz" ;;
            *)         OUT="dist/lokey-pi5-sdcard.img" ;;
          esac
          cp -L "${IMG}" "${OUT}"
          (cd dist && sha256sum "$(basename "${OUT}")" > SHA256SUMS-sdcard.txt)
          ls -lh dist/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: lokey-pi5-sdcard
          path: dist/
          retention-days: 30
          compression-level: 0

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Wait for semantic-release / softprops to create the release object.
          for i in $(seq 1 60); do
            if gh release view "${TAG}" >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for release ${TAG}... (${i})"
            sleep 15
          done
          gh release view "${TAG}"
          gh release upload "${TAG}" dist/* --clobber
