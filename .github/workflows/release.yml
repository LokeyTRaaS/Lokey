name: Semantic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    # Skip the chore(release) commit itself.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # semantic-release 26 requires Node >= 26.13.
          node-version: "26.13"
          cache: npm

      - name: Install release dependencies
        run: npm ci

      - name: Run semantic-release
        id: semantic
        env:
          # Prefer RELEASE_TOKEN (fine-grained PAT). LokeyTRaaS forbids lifetimes
          # > 366 days — set expiry ≤ 366d. Fallback: GITHUB_TOKEN + explicit dispatch.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: semantic-release-bot
          GIT_AUTHOR_EMAIL: semantic-release-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: semantic-release-bot
          GIT_COMMITTER_EMAIL: semantic-release-bot@users.noreply.github.com
        run: |
          set -euo pipefail
          # The semantic-release GitHub Action imports the library on the
          # runner's Node 24 runtime. semantic-release 26 refuses that, so run
          # the CLI on the Node version from setup-node. Plugins are the
          # package.json devDependencies loaded by .releaserc.json.
          npx semantic-release
          tag="$(git tag --points-at HEAD --list 'v[0-9]*' | head -n 1 || true)"
          if [ -n "${tag}" ]; then
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
            echo "new_release_version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger artifact build for the new tag
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.semantic.outputs.new_release_version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          echo "Dispatching build.yml for ${TAG}"
          gh workflow run build.yml --repo "${{ github.repository }}" --ref "${TAG}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Semantic Release"
            echo "- published: \`${{ steps.semantic.outputs.new_release_published || 'false' }}\`"
            echo "- version: \`${{ steps.semantic.outputs.new_release_version || 'n/a' }}\`"
            if [ "${{ steps.semantic.outputs.new_release_published }}" = "true" ]; then
              echo "- next: \`build.yml\` dispatched for \`v${{ steps.semantic.outputs.new_release_version }}\`"
            fi
            echo "- docs: https://github.com/${{ github.repository }}/blob/main/docs/releasing.md (\`RELEASE_TOKEN\`)"
          } >> "$GITHUB_STEP_SUMMARY"
