
name: Build Multi-Architecture Binaries and Containers

on:
  push:
    branches:
      - main
      - prerelease/**
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  GO_VERSION: '1.27'
  PROJECT_URL: https://lokey.cloud
  LICENSE: MIT

jobs:
  # Generate Swagger docs first (API service only)
  generate-swagger:
    name: Generate Swagger Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generate Swagger documentation
        run: |
          echo "=== Generating Swagger documentation ==="
          swag init --parseDependency --parseInternal \
            --generalInfo main.go \
            --dir ./cmd/api/,./pkg/api \
            --output ./pkg/api/docs
          
          echo ""
          echo "=== Generated Swagger files ==="
          ls -lah ./pkg/api/docs/

      - name: Upload Swagger documentation
        uses: actions/upload-artifact@v5
        with:
          name: swagger-docs
          path: pkg/api/docs/
          retention-days: 30
          compression-level: 6

  # Build native binaries for multiple architectures in parallel
  build-binaries:
    name: Build ${{ matrix.service }} Binary (${{ matrix.arch }})
    runs-on: ubuntu-latest
    # All builds wait for swagger to be generated
    needs: generate-swagger
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: controller
            arch: amd64
            goarch: amd64
            cc: gcc
            cgo: "1"
          - service: controller
            arch: arm64
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            cgo: "1"
          - service: api
            arch: amd64
            goarch: amd64
            cc: gcc
            cgo: "1"
          - service: api
            arch: arm64
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            cgo: "1"
          - service: fortuna
            arch: amd64
            goarch: amd64
            cc: gcc
            cgo: "1"
          - service: fortuna
            arch: arm64
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            cgo: "1"
          - service: virtio
            arch: amd64
            goarch: amd64
            cc: gcc
            cgo: "0"
          - service: virtio
            arch: arm64
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            cgo: "0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            cmd/${{ matrix.service }}/go.sum

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update -qq
          if [ "${{ matrix.arch }}" = "arm64" ] && [ "${{ matrix.cgo }}" = "1" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      # Download swagger docs for ALL API builds
      - name: Download Swagger documentation for API builds
        if: matrix.service == 'api'
        uses: actions/download-artifact@v6
        with:
          name: swagger-docs
          path: ./pkg/api/docs

      - name: Download dependencies
        run: |
          go mod download
          cd cmd/${{ matrix.service }} && go mod download

      - name: Build binary for ${{ matrix.arch }}
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p build
          cd cmd/${{ matrix.service }}
          go build -v -x -trimpath -ldflags="-s -w" -o ../../build/lokey-${{ matrix.service }}-${{ matrix.arch }}

      - name: Verify binary
        run: |
          echo "=== Binary verification ==="
          file build/lokey-${{ matrix.service }}-${{ matrix.arch }}
          ls -lh build/lokey-${{ matrix.service }}-${{ matrix.arch }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v5
        with:
          name: lokey-${{ matrix.service }}-${{ matrix.arch }}
          path: build/lokey-${{ matrix.service }}-${{ matrix.arch }}
          retention-days: 30
          compression-level: 9

  # Build Docker images for multiple architectures
  build-containers:
    name: Build ${{ matrix.service }} Container (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: read
      packages: write
    outputs:
      controller-amd64-digest: ${{ steps.build-push.outputs.digest }}
      controller-arm64-digest: ${{ steps.build-push.outputs.digest }}
      api-amd64-digest: ${{ steps.build-push.outputs.digest }}
      api-arm64-digest: ${{ steps.build-push.outputs.digest }}
      fortuna-amd64-digest: ${{ steps.build-push.outputs.digest }}
      fortuna-arm64-digest: ${{ steps.build-push.outputs.digest }}
      virtio-amd64-digest: ${{ steps.build-push.outputs.digest }}
      virtio-arm64-digest: ${{ steps.build-push.outputs.digest }}
    strategy:
      fail-fast: false
      matrix:
        service: [ controller, api, fortuna, virtio ]
        arch: [ amd64, arm64 ]
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create build directory
        run: mkdir -p build

      - name: Download binary artifact for ${{ matrix.arch }}
        uses: actions/download-artifact@v6
        with:
          name: lokey-${{ matrix.service }}-${{ matrix.arch }}
          path: ./build

      # Download Swagger docs for API service
      - name: Download Swagger documentation
        if: matrix.service == 'api'
        uses: actions/download-artifact@v6
        with:
          name: swagger-docs
          path: ./pkg/api/docs

      - name: Verify artifacts and prepare for build
        run: |
          echo "=== Binary verification ==="
          ls -la ./build/

          # The artifact contains the binary with arch suffix
          BINARY_WITH_ARCH="./build/lokey-${{ matrix.service }}-${{ matrix.arch }}"
          BINARY_STANDARD="./build/lokey-${{ matrix.service }}"

          if [ -f "$BINARY_WITH_ARCH" ]; then
            echo "Found: $BINARY_WITH_ARCH"
            file "$BINARY_WITH_ARCH"
            chmod +x "$BINARY_WITH_ARCH"

            # Create a standardized binary name for Docker (removes arch suffix)
            cp "$BINARY_WITH_ARCH" "$BINARY_STANDARD"
            echo "Created standardized binary: $BINARY_STANDARD"
            ls -lh "$BINARY_STANDARD"
          
            # Verify the file is readable and in the correct location
            echo ""
            echo "=== Final verification before Docker build ==="
            pwd
            ls -la build/
            file "build/lokey-${{ matrix.service }}"
          else
            echo "ERROR: Binary not found at $BINARY_WITH_ARCH"
            echo "Contents of ./build/:"
            ls -la ./build/
            exit 1
          fi

          # Verify Swagger docs for API service
          if [ "${{ matrix.service }}" == "api" ]; then
            echo ""
            echo "=== Swagger documentation verification ==="
            if [ -d "./pkg/api/docs" ]; then
              ls -la ./pkg/api/docs/
              [ -f "./pkg/api/docs/swagger.json" ] && echo "✓ swagger.json found"
              [ -f "./pkg/api/docs/swagger.yaml" ] && echo "✓ swagger.yaml found"
            else
              echo "⚠ Swagger docs directory not found"
            fi
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.arch }}
            type=ref,event=pr,suffix=-${{ matrix.arch }}
            type=semver,pattern={{version}},suffix=-${{ matrix.arch }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.arch }}
            type=sha,prefix=sha-,suffix=-${{ matrix.arch }}
            type=raw,value=latest-${{ matrix.arch }},enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=LoKey ${{ matrix.service }}
            org.opencontainers.image.description=${{ matrix.service == 'controller' && 'ATECC608A hardware TRNG controller service' || matrix.service == 'api' && 'Main REST API service with in-memory queues and Swagger documentation' || matrix.service == 'virtio' && 'VirtIO entropy pipe and HTTP streaming consumer' || 'Fortuna CSPRNG amplifier service for high-throughput random number generation' }}
            org.opencontainers.image.url=${{ env.PROJECT_URL }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=${{ env.LICENSE }}
            org.opencontainers.image.vendor=LoKey TRaaS
          flavor: |
            latest=false

      - name: Build and push Docker image for ${{ matrix.platform }}
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./cmd/${{ matrix.service }}/Dockerfile.action
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.arch }}
          provenance: false
          sbom: false

      - name: Save digest to file
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build-push.outputs.digest }}"
          echo "$digest" > "/tmp/digests/${{ matrix.service }}-${{ matrix.arch }}.txt"
          echo "Saved digest for ${{ matrix.service }}-${{ matrix.arch }}: $digest"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: digest-${{ matrix.service }}-${{ matrix.arch }}
          path: /tmp/digests/
          retention-days: 1

  # Create multi-arch manifest lists (amd64 + arm64)
  create-manifests:
    name: Create Multi-Arch Manifests
    runs-on: ubuntu-latest
    needs: build-containers
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [controller, api, fortuna, virtio]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push manifest
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${REPO_LOWER}/${SERVICE}"
          REF_NAME="${GITHUB_REF_NAME}"
          BRANCH_TAG=$(echo "${REF_NAME}" | sed 's/\//-/g')

          # docker/metadata-action semver tags omit the leading "v"
          # (e.g. 1.1.0-amd64), while GITHUB_REF_NAME for tags is v1.1.0.
          SOURCE_TAG="${BRANCH_TAG}"
          MANIFEST_TAGS=()

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${REF_NAME#v}"
            SOURCE_TAG="${VERSION}"
            MANIFEST_TAGS+=("${VERSION}" "v${VERSION}" "latest")
          elif [ "${REF_NAME}" = "${{ github.event.repository.default_branch }}" ]; then
            MANIFEST_TAGS+=("${BRANCH_TAG}" "latest")
          else
            MANIFEST_TAGS+=("${BRANCH_TAG}")
          fi

          echo "Looking for arch images under ${IMAGE}:${SOURCE_TAG}-{amd64,arm64}"
          docker buildx imagetools inspect "${IMAGE}:${SOURCE_TAG}-amd64"
          docker buildx imagetools inspect "${IMAGE}:${SOURCE_TAG}-arm64"

          for tag in "${MANIFEST_TAGS[@]}"; do
            echo "Creating manifest ${IMAGE}:${tag}"
            docker buildx imagetools create -t "${IMAGE}:${tag}" \
              "${IMAGE}:${SOURCE_TAG}-amd64" \
              "${IMAGE}:${SOURCE_TAG}-arm64"
          done

  # Create release with all artifacts
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [generate-swagger, build-binaries, build-containers, create-manifests]
    # Publish binary/docs archives even if multi-arch manifests flake.
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-binaries.result == 'success' &&
      needs.generate-swagger.result == 'success'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download binary artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: lokey-*
          path: ./artifacts
          merge-multiple: false

      - name: Download Swagger documentation
        uses: actions/download-artifact@v6
        with:
          name: swagger-docs
          path: ./artifacts/swagger-docs

      - name: Create checksums
        run: |
          cd artifacts
          
          # Create checksums for each architecture
          for arch in amd64 arm64; do
            echo "Creating checksums for ${arch}"
            for service in controller api fortuna virtio; do
              if [ -d "lokey-${service}-${arch}" ]; then
                cd "lokey-${service}-${arch}"
                sha256sum * > checksums-${arch}.txt
                cd ..
              fi
            done
          done
          
          # Create combined checksum file for all binaries
          find . -name "lokey-*" -type f -exec sha256sum {} \; > ../all-checksums.txt
          
          # Create checksum for swagger docs
          if [ -d "swagger-docs" ]; then
            cd swagger-docs
            sha256sum * > ../swagger-checksums.txt
            cd ..
          fi

      - name: Create release archives
        run: |
          mkdir -p releases
          cd artifacts

          # Per-service, per-architecture archives only (no mega-tarballs).
          for service in controller api fortuna virtio; do
            for arch in amd64 arm64; do
              if [ -d "lokey-${service}-${arch}" ]; then
                tar -czf ../releases/lokey-${service}-${arch}.tar.gz \
                  -C lokey-${service}-${arch} .
              fi
            done
          done

          if [ -d "swagger-docs" ]; then
            tar -czf ../releases/swagger-docs.tar.gz -C swagger-docs .
          fi

      - name: Generate release notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          # Strip leading v for container tags published by metadata-action.
          VERSION_NOPREFIX="${VERSION#v}"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          cat << EOF > release_notes.md
          ## LoKey ${VERSION}

          ### Containers (GHCR, multi-arch)
          \`\`\`bash
          docker pull ghcr.io/${REPO_LOWER}/api:${VERSION_NOPREFIX}
          docker pull ghcr.io/${REPO_LOWER}/controller:${VERSION_NOPREFIX}
          docker pull ghcr.io/${REPO_LOWER}/fortuna:${VERSION_NOPREFIX}
          docker pull ghcr.io/${REPO_LOWER}/virtio:${VERSION_NOPREFIX}
          \`\`\`

          Prefer these multi-arch tags; arch-specific tags also exist as \`${VERSION_NOPREFIX}-amd64\` / \`${VERSION_NOPREFIX}-arm64\`.

          ### Binaries
          Per-service archives are attached (e.g. \`lokey-api-arm64.tar.gz\`). See the README for run instructions.

          ### NixOS (most reproducible)
          Build and flash a Pi 5 SD image locally — CI does not ship the image:

          \`\`\`bash
          nix build .#packages.aarch64-linux.sdcard
          ./scripts/flash-sd.sh /dev/sdX
          \`\`\`

          Details: [docs/nixos.md](https://github.com/${{ github.repository }}/blob/main/docs/nixos.md)

          ### Docs
          - [README](https://github.com/${{ github.repository }}/blob/main/ReadMe.md)
          - [Hardware setup](https://github.com/${{ github.repository }}/blob/main/docs/hardware-setup.md)
          - Swagger: \`swagger-docs.tar.gz\` on this release
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/*.tar.gz
            all-checksums.txt
            swagger-checksums.txt
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Summary job for status checks
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [generate-swagger, build-binaries, build-containers, create-manifests]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: ./artifacts

      - name: Generate comprehensive summary
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          BRANCH_TAG=$(echo "${GITHUB_REF_NAME}" | sed 's/\//-/g')
          
          echo "# 🚀 Multi-Architecture Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## 📊 Build Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | AMD64 Binary | ARM64 Binary | Container | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------------|--------------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          
          BINARY_STATUS="${{ needs.build-binaries.result }}"
          CONTAINER_STATUS="${{ needs.build-containers.result }}"
          
          if [ "$BINARY_STATUS" == "success" ] && [ "$CONTAINER_STATUS" == "success" ]; then
            OVERALL="✅ All Passed"
          else
            OVERALL="❌ Failed"
          fi
          
          for service in controller api fortuna virtio; do
            AMD64_ICON="❌"
            ARM64_ICON="❌"
          
            [ -f "./artifacts/lokey-${service}-amd64/lokey-${service}-amd64" ] && AMD64_ICON="✅"
            [ -f "./artifacts/lokey-${service}-arm64/lokey-${service}-arm64" ] && ARM64_ICON="✅"
          
            CONTAINER_ICON="✅"
            [ "$CONTAINER_STATUS" != "success" ] && CONTAINER_ICON="❌"
          
            echo "| lokey-${service} | ${AMD64_ICON} | ${ARM64_ICON} | ${CONTAINER_ICON} | ${OVERALL} |" >> $GITHUB_STEP_SUMMARY
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## 📦 Binary Artifacts by Architecture" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          for arch in amd64 arm64; do
            echo "### ${arch^^}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Service | Binary Name | Size | SHA256 |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-------------|------|--------|" >> $GITHUB_STEP_SUMMARY
          
            for service in controller api fortuna virtio; do
              ARTIFACT_PATH="./artifacts/lokey-${service}-${arch}/lokey-${service}-${arch}"
              if [ -f "$ARTIFACT_PATH" ]; then
                SIZE=$(ls -lh "$ARTIFACT_PATH" | awk '{print $5}')
                SHA256=$(sha256sum "$ARTIFACT_PATH" | awk '{print substr($1,1,16)"..."}')
                echo "| lokey-${service} | \`lokey-${service}-${arch}\` | $SIZE | \`$SHA256\` |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| lokey-${service} | \`lokey-${service}-${arch}\` | N/A | N/A |" >> $GITHUB_STEP_SUMMARY
              fi
            done
            echo "" >> $GITHUB_STEP_SUMMARY
          done
          
          echo "> 💡 **Tip**: All binaries are available in the **Artifacts** section for 30 days." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## 📚 API Documentation (OpenAPI/Swagger)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "./artifacts/swagger-docs" ]; then
            echo "✅ OpenAPI specification available for download." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          
            [ -f "./artifacts/swagger-docs/swagger.json" ] && \
              echo "| \`swagger.json\` | $(ls -lh ./artifacts/swagger-docs/swagger.json | awk '{print $5}') |" >> $GITHUB_STEP_SUMMARY
            [ -f "./artifacts/swagger-docs/swagger.yaml" ] && \
              echo "| \`swagger.yaml\` | $(ls -lh ./artifacts/swagger-docs/swagger.yaml | awk '{print $5}') |" >> $GITHUB_STEP_SUMMARY
          
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Access at:** \`http://your-api:8080/swagger/index.html\`" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## 🐳 Container Images" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Multi-architecture images available:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Service | Architecture | Name | SHA |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|--------------|------|-----|" >> $GITHUB_STEP_SUMMARY
          
            for service in controller api fortuna virtio; do
              for arch in amd64 arm64; do
                # Read digest from artifact if it exists
                DIGEST_FILE="./artifacts/digest-${service}-${arch}/${service}-${arch}.txt"
                if [ -f "$DIGEST_FILE" ]; then
                  FULL_DIGEST=$(cat "$DIGEST_FILE")
                  # Extract just the SHA (remove 'sha256:' prefix if present)
                  SHORT_SHA=$(echo "$FULL_DIGEST" | sed 's/sha256://' | cut -c1-12)
                  IMAGE_NAME="ghcr.io/${REPO_LOWER}/${service}:${BRANCH_TAG}-${arch}"
                  echo "| ${service} | ${arch} | \`${BRANCH_TAG}-${arch}\` | \`${SHORT_SHA}...\` |" >> $GITHUB_STEP_SUMMARY
                else
                  echo "| ${service} | ${arch} | \`${BRANCH_TAG}-${arch}\` | N/A |" >> $GITHUB_STEP_SUMMARY
                fi
              done
            done
          
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Pull commands:**" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "# AMD64" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ghcr.io/${REPO_LOWER}/controller:${BRANCH_TAG}-amd64" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "# ARM64 (Raspberry Pi 4/5)" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ghcr.io/${REPO_LOWER}/controller:${BRANCH_TAG}-arm64" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "# Multi-arch manifest" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ghcr.io/${REPO_LOWER}/controller:${BRANCH_TAG}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "🔄 Pull request build - images not pushed." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## ℹ️ Build Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow**: ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run**: #${{ github.run_number }} (ID: ${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${GITHUB_REF_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Go**: ${{ env.GO_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Architectures**: AMD64, ARM64" >> $GITHUB_STEP_SUMMARY
          echo "- **CGO**: Enabled" >> $GITHUB_STEP_SUMMARY
          echo "- **Project**: [lokey.cloud](https://lokey.cloud)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$BINARY_STATUS" == "success" ] && [ "$CONTAINER_STATUS" == "success" ]; then
            echo "### ✅ All builds completed successfully!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Some builds failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi