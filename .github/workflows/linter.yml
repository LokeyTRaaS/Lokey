name: Lint and Test

on:
  push:
    branches:
      - main
      - feature/**
      - debug/**
      - prerelease/**
      - refactor/**
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      - name: Download dependencies
        run: |
          go mod download
          (cd cmd/api && go mod download)
          (cd cmd/controller && go mod download)
          (cd cmd/fortuna && go mod download)
          (cd cmd/virtio && go mod download)

      - name: Check go.mod / go.sum tidy
        run: |
          set -euo pipefail
          tidy_one() {
            local dir="$1"
            (cd "$dir" && go mod tidy)
          }
          tidy_one .
          tidy_one cmd/api
          tidy_one cmd/controller
          tidy_one cmd/fortuna
          tidy_one cmd/virtio
          if ! git diff --exit-code -- go.mod go.sum cmd/*/go.mod cmd/*/go.sum; then
            echo "go mod tidy produced changes; commit the tidy result"
            exit 1
          fi

      - name: Run golangci-lint on source code
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: --config .golangci.yml ./pkg/... ./cmd/...

      - name: Run golangci-lint on tests
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: --config .golangci-tests.yml ./tests/...

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      - name: Download dependencies
        run: |
          go mod download
          (cd cmd/api && go mod download)
          (cd cmd/controller && go mod download)
          (cd cmd/fortuna && go mod download)
          (cd cmd/virtio && go mod download)

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        if: always()

  nix-flake:
    name: Nix flake check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Validate flake
        run: |
          set -euo pipefail
          # Lightweight checks only — never build the SD image in CI.
          nix flake metadata
          nix flake show
          host="$(nix eval .#nixosConfigurations.lokey-pi5.config.networking.hostName --raw)"
          test "${host}" = "lokey-pi5"
          nix eval .#packages.aarch64-linux.sdcard.name --raw
          echo "Nix flake OK"

  grype:
    name: Grype
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Scan dependencies with Grype
        id: scan
        uses: anchore/scan-action@v7
        with:
          path: "."
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      - name: Upload SARIF to GitHub code scanning
        if: always() && steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          govulncheck ./...
          (cd cmd/api && govulncheck ./...)
          (cd cmd/controller && govulncheck ./...)
          (cd cmd/fortuna && govulncheck ./...)
          (cd cmd/virtio && govulncheck ./...)
