---
# LoKey stack — linux/amd64 + linux/arm64
# Networks: edge (Traefik), app (api/fortuna/virtio), devices (controllers), metrics
# Controllers via COMPOSE_PROFILES:
#   emulated  — controller-a + controller-b (crypto/rand; laptop/CI default)
#   hardware  — single controller-hw-a on /dev/i2c-1 @ 0x60 (ATECC608A/B)

networks:
  lokey-edge:
    driver: bridge
  lokey-app:
    driver: bridge
  lokey-devices:
    driver: bridge
  lokey-metrics:
    driver: bridge

volumes:
  traefik-acme:
  traefik-access:
  prometheus-data:
  grafana-data:
  loki-data:

x-logging: &logging-common
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-api-env: &api-env
  PORT: "8080"
  # Override via .env for hardware profile (single controller-hw-a).
  CONTROLLER_ADDR: ${CONTROLLER_ADDR:-http://controller-a:8081}
  CONTROLLER_ADDRS: ${CONTROLLER_ADDRS:-device_a=http://controller-a:8081,device_b=http://controller-b:8081}
  FORTUNA_ADDR: http://fortuna:8082
  VIRTIO_ADDR: http://virtio:8083
  TRNG_QUEUE_SIZE: "2000000"
  FORTUNA_QUEUE_SIZE: "2000000"
  VIRTIO_QUEUE_SIZE: "1000000"
  TRNG_POLL_INTERVAL_MS: "100"
  FORTUNA_POLL_INTERVAL_MS: "100"
  VIRTIO_SEED_INTERVAL_SECONDS: "30"
  VIRTIO_SEEDING_SOURCE: trng
  TRNG_CONSUME: "false"
  FORTUNA_CONSUME: "false"
  VIRTIO_CONSUME: "true"
  # 0.1 means 10 percent of new items. Fortuna's reseed reads the stored TRNG ring.
  FORTUNA_SEED_RATIO: "0.1"
  FORTUNA_SEED_CONSUME: "false"
  VIRTIO_TRNG_RATIO: "0.1"
  VIRTIO_FORTUNA_RATIO: "0"
  VIRTIO_TRNG_CONSUME: "false"
  VIRTIO_FORTUNA_CONSUME: "false"
  # Mixed POST /data ratios. 0 leaves that ring out. 0.1 reads every 10th item.
  DATA_TRNG_RATIO: "0"
  DATA_FORTUNA_RATIO: "0"
  TRNG_APT_WINDOW_SIZE: "512"

x-fortuna-env: &fortuna-env
  PORT: "8082"
  AMPLIFICATION_FACTOR: "4"

x-virtio-env: &virtio-env
  PORT: "8083"
  VIRTIO_QUEUE_SIZE: "1000000"
  VIRTIO_PIPE_PATH: /var/run/lokey/virtio-rng

x-controller-env-base: &controller-env-base
  PORT: "8081"
  CONTROLLER_MODE: emulated
  FORCE_CONFIG: "false"
  GIN_MODE: release
  LOG_LEVEL: WARN

services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    logging: *logging-common
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    environment:
      LOKEY_DOMAIN: ${LOKEY_DOMAIN:-localhost}
      LOKEY_ACME_EMAIL: ${LOKEY_ACME_EMAIL:-admin@example.com}
    command:
      # File provider is primary (works without Docker API negotiation).
      # Docker provider optional via LOKEY_TRAEFIK_DOCKER=true on compatible hosts.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # Prometheus metrics on an internal entrypoint (scraped on lokey-metrics only).
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entryPoint=metrics
      - --metrics.prometheus.addEntryPointsLabels=true
      - --metrics.prometheus.addServicesLabels=true
      - --metrics.prometheus.addRoutersLabels=true
      - --api.dashboard=true
      - --api.insecure=false
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.filepath=/logs/access.log
      - --certificatesresolvers.letsencrypt.acme.email=${LOKEY_ACME_EMAIL:-admin@example.com}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --log.level=INFO
    volumes:
      - ./deploy/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./deploy/traefik/certs:/certs:ro
      - traefik-acme:/acme
      - traefik-access:/logs
    security_opt:
      - seccomp=./deploy/seccomp/observability.json
    networks:
      - lokey-edge
      - lokey-app
      - lokey-metrics

  api:
    image: ${LOKEY_IMAGE_API:-ghcr.io/lokeytraas/lokey/api:latest}
    # Always re-resolve :latest (or other floating tags) on up/pull.
    pull_policy: always
    build:
      context: .
      dockerfile: cmd/api/Dockerfile
    restart: unless-stopped
    logging: *logging-common
    depends_on:
      fortuna:
        condition: service_started
      virtio:
        condition: service_started
      controller-a:
        condition: service_started
        required: false
      controller-b:
        condition: service_started
        required: false
      controller-hw-a:
        condition: service_started
        required: false
    environment:
      <<: *api-env
      GIN_MODE: release
      LOG_LEVEL: WARN
    security_opt:
      - seccomp=./deploy/seccomp/api.json
    networks:
      - lokey-edge
      - lokey-app
      - lokey-devices
    labels:
      - traefik.enable=true
      - traefik.docker.network=lokey-edge
      - traefik.http.routers.lokey-api.rule=Host(`${LOKEY_DOMAIN:-localhost}`) && (PathPrefix(`/api`) || PathPrefix(`/metrics`) || PathPrefix(`/swagger`))
      - traefik.http.routers.lokey-api.entrypoints=websecure
      - traefik.http.routers.lokey-api.tls=true
      - traefik.http.services.lokey-api.loadbalancer.server.port=8080
    deploy:
      resources:
        limits:
          memory: 2G

  fortuna:
    image: ${LOKEY_IMAGE_FORTUNA:-ghcr.io/lokeytraas/lokey/fortuna:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: cmd/fortuna/Dockerfile
    restart: unless-stopped
    logging: *logging-common
    environment:
      <<: *fortuna-env
      GIN_MODE: release
      LOG_LEVEL: WARN
    volumes:
      - ./deploy/seccomp/fortuna.json:/seccomp/fortuna.json:ro
    security_opt:
      - seccomp=./deploy/seccomp/fortuna.json
    networks:
      - lokey-app
    deploy:
      resources:
        limits:
          memory: 128M

  virtio:
    image: ${LOKEY_IMAGE_VIRTIO:-ghcr.io/lokeytraas/lokey/virtio:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: cmd/virtio/Dockerfile
    restart: unless-stopped
    logging: *logging-common
    environment:
      <<: *virtio-env
      GIN_MODE: release
      LOG_LEVEL: WARN
    volumes:
      - ./run/lokey:/var/run/lokey
      - ./deploy/seccomp/virtio.json:/seccomp/virtio.json:ro
    security_opt:
      - seccomp=./deploy/seccomp/virtio.json
    networks:
      - lokey-edge
      - lokey-app
    labels:
      - traefik.enable=true
      - traefik.docker.network=lokey-edge
      - traefik.http.routers.lokey-virtio.rule=Host(`${LOKEY_DOMAIN:-localhost}`) && PathPrefix(`/virtio`)
      - traefik.http.routers.lokey-virtio.entrypoints=websecure
      - traefik.http.routers.lokey-virtio.tls=true
      - traefik.http.middlewares.lokey-virtio-strip.stripprefix.prefixes=/virtio
      - traefik.http.routers.lokey-virtio.middlewares=lokey-virtio-strip
      - traefik.http.services.lokey-virtio.loadbalancer.server.port=8083
      - traefik.http.services.lokey-virtio.loadbalancer.responseforwarding.flushinterval=1ms
    deploy:
      resources:
        limits:
          memory: 512M

  # Emulated controllers — COMPOSE_PROFILES=emulated (laptop/CI)
  controller-a:
    image: ${LOKEY_IMAGE_CONTROLLER:-ghcr.io/lokeytraas/lokey/controller:latest}
    pull_policy: always
    profiles: ["emulated"]
    build:
      context: .
      dockerfile: cmd/controller/Dockerfile
    restart: unless-stopped
    logging: *logging-common
    environment:
      <<: *controller-env-base
      DEVICE_ID: device_a
    volumes:
      - ./deploy/seccomp/controller.json:/seccomp/controller.json:ro
    security_opt:
      - seccomp=./deploy/seccomp/controller.json
    networks:
      - lokey-devices
    deploy:
      resources:
        limits:
          memory: 64M

  controller-b:
    image: ${LOKEY_IMAGE_CONTROLLER:-ghcr.io/lokeytraas/lokey/controller:latest}
    pull_policy: always
    profiles: ["emulated"]
    build:
      context: .
      dockerfile: cmd/controller/Dockerfile
    restart: unless-stopped
    logging: *logging-common
    environment:
      <<: *controller-env-base
      DEVICE_ID: device_b
    volumes:
      - ./deploy/seccomp/controller.json:/seccomp/controller.json:ro
    security_opt:
      - seccomp=./deploy/seccomp/controller.json
    networks:
      - lokey-devices
    deploy:
      resources:
        limits:
          memory: 64M

  # Single ATECC608A/B on I2C bus 1 (SDA1/SCL1 @ 0x60) — COMPOSE_PROFILES=hardware
  controller-hw-a:
    image: ${LOKEY_IMAGE_CONTROLLER:-ghcr.io/lokeytraas/lokey/controller:latest}
    pull_policy: always
    profiles: ["hardware"]
    restart: unless-stopped
    logging: *logging-common
    environment:
      PORT: "8081"
      CONTROLLER_MODE: hardware
      DEVICE_ID: device_a
      I2C_BUS_NUMBER: "1"
      I2C_ADDRESS: "0x60"
      FORCE_CONFIG: "false"
      GIN_MODE: release
      LOG_LEVEL: INFO
    devices:
      - /dev/i2c-1:/dev/i2c-1
    # Host i2c group GID (Pi OS: getent group i2c). Container runs as root; GID keeps
    # access if the image later drops privileges.
    group_add:
      - "988"
    cap_add:
      - SYS_RAWIO
    security_opt:
      - seccomp=./deploy/seccomp/controller.json
    networks:
      - lokey-devices
    deploy:
      resources:
        limits:
          memory: 64M

  node-exporter:
    image: prom/node-exporter:v1.9.0
    restart: unless-stopped
    logging: *logging-common
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    security_opt:
      - seccomp=./deploy/seccomp/observability.json
    networks:
      - lokey-metrics

  cadvisor:
    # v0.54+ required for Docker 29 containerd-snapshotter (overlayfs); older
    # releases fail on missing /var/lib/docker/image/overlayfs/layerdb/mounts.
    image: ghcr.io/google/cadvisor:v0.61.1
    restart: unless-stopped
    logging: *logging-common
    # Host/cgroup visibility still needs privileged; seccomp still applies when set
    # explicitly and blocks kexec/modules/ptrace while allowing mount/setns.
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    command:
      - --housekeeping_interval=15s
      - --docker_only=true
      - --store_container_labels=true
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project,com.docker.compose.container-number
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      # Snap Docker uses /var/snap/docker/common/var-lib-docker; override via DOCKER_ROOT_DIR.
      - ${DOCKER_ROOT_DIR:-/var/lib/docker}:/var/lib/docker:ro
      - /var/lib/containerd:/var/lib/containerd:ro
      - /run/containerd:/run/containerd:ro
      - /dev/disk/:/dev/disk:ro
    security_opt:
      - seccomp=./deploy/seccomp/cadvisor.json
    networks:
      - lokey-metrics

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    logging: *logging-common
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    security_opt:
      - seccomp=./deploy/seccomp/observability.json
    networks:
      - lokey-metrics
      - lokey-app
      - lokey-devices

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    logging: *logging-common
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-lokey}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Required when exposed under Traefik PathPrefix /grafana (do not strip the prefix).
      GF_SERVER_DOMAIN: ${LOKEY_DOMAIN:-localhost}
      GF_SERVER_ROOT_URL: https://${LOKEY_DOMAIN:-localhost}:${TRAEFIK_HTTPS_PORT:-443}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./deploy/grafana/img/lokey-logo.png:/usr/share/grafana/public/img/lokey-logo.png:ro
    security_opt:
      - seccomp=./deploy/seccomp/observability.json
    networks:
      - lokey-edge
      - lokey-metrics
    labels:
      - traefik.enable=true
      - traefik.docker.network=lokey-edge
      - traefik.http.routers.lokey-grafana.rule=Host(`${LOKEY_DOMAIN:-localhost}`) && PathPrefix(`/grafana`)
      - traefik.http.routers.lokey-grafana.entrypoints=websecure
      - traefik.http.routers.lokey-grafana.tls=true
      - traefik.http.services.lokey-grafana.loadbalancer.server.port=3000

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    logging: *logging-common
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./deploy/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks:
      - lokey-metrics
    deploy:
      resources:
        limits:
          memory: 256M

  alloy:
    image: grafana/alloy:v1.7.5
    restart: unless-stopped
    logging: *logging-common
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - traefik-access:/logs:ro
    networks:
      - lokey-metrics
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 128M

  landing:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *logging-common
    volumes:
      - ./deploy/landing:/usr/share/nginx/html:ro
    networks:
      - lokey-edge
