global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Primary LoKey series (queues, quality, Fortuna amplification, VirtIO-via-API).
  - job_name: lokey-api
    static_configs:
      - targets: ["api:8080"]

  # Native VirtIO service metrics (queue depth at the consumer).
  - job_name: lokey-virtio
    static_configs:
      - targets: ["virtio:8083"]

  # Traefik entrypoint / request / service metrics (internal metrics entrypoint).
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]

  # Host machine metrics.
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # Container / cgroup metrics.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
